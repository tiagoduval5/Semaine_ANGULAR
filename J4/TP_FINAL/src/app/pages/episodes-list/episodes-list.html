<section class="page">
  <h1>Liste des episodes</h1>
  <p class="intro">Tous les episodes disponibles dans l'API.</p>

  @if (chargement()) {
    <app-loader />
  } @else if (erreur()) {
    <app-error-message [message]="erreur()!" (retry)="charger()" />
  } @else {
    <div class="grille">
      @for (ep of episodes(); track ep.id) {
        <a class="carte carte-icone" [routerLink]="['/episodes', ep.id]">
          <div class="entete entete--episode">
            <span class="emoji" aria-hidden="true">📺</span>
            <span class="code-episode">{{ ep.episode }}</span>
          </div>
          <div class="corps">
            <h3>{{ ep.name | truncate: 45 }}</h3>
            <p class="meta">📅 {{ ep.air_date | dateFr }}</p>
          </div>
        </a>
      }
    </div>
    <app-paginator
      [currentPage]="pageCourante()"
      [totalPages]="totalPages()"
      (prev)="pagePrecedente()"
      (next)="pageSuivante()"
    />
  }
</section>
