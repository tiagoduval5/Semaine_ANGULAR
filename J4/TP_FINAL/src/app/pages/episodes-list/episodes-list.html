<section class="page">
  <h1>Liste des episodes</h1>
  <p class="intro">Tous les episodes disponibles dans l'API.</p>

  @if (chargement()) {
    <app-loader />
  } @else if (erreur()) {
    <app-error-message [message]="erreur()!" (retry)="charger()" />
  } @else {
    <div class="grille">
      @for (ep of episodes(); track ep.id) {
        <a class="carte" [routerLink]="['/episodes', ep.id]">
          <strong>{{ ep.episode }}</strong>
          <h3>{{ ep.name | truncate: 45 }}</h3>
          <p>{{ ep.air_date }}</p>
        </a>
      }
    </div>
    <app-paginator
      [currentPage]="pageCourante()"
      [totalPages]="totalPages()"
      (prev)="pagePrecedente()"
      (next)="pageSuivante()"
    />
  }
</section>
