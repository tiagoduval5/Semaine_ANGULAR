<section class="page">
  <a class="back" routerLink="/dashboard">← Retour au tableau de bord</a>
  <h1>Mes favoris</h1>
  <p class="intro">
    Les personnages ajoutes ici sont sauvegardes dans le navigateur (localStorage).
  </p>

  @if (favoris.favoris().length === 0) {
    <p class="vide">Aucun favori pour le moment. Ajoutez-en depuis la liste des personnages.</p>
  } @else {
    <div class="grille">
      @for (p of favoris.favoris(); track p.id) {
        <app-character-card
          [personnage]="p"
          [estFavori]="true"
          (toggleFavori)="favoris.toggle($event)"
        />
      }
    </div>
  }
</section>
