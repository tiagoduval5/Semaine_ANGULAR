<a class="back" routerLink="/episodes">← Retour a la liste</a>

@if (chargement()) {
  <app-loader />
} @else if (erreur()) {
  <app-error-message [message]="erreur()!" (retry)="chargerFiche()" />
} @else {
  @if (episode(); as ep) {
    <section class="fiche">
      <h1>{{ ep.name }}</h1>
      <p><strong>Code :</strong> {{ ep.episode }}</p>
      <p><strong>Date :</strong> {{ ep.air_date | dateFr }}</p>

      <h2>Personnages de l'episode</h2>
      <div class="casting">
        @for (p of personnages(); track p.id) {
          <a class="perso" [routerLink]="['/characters', p.id]">
            <img [src]="p.image" [alt]="p.name" />
            <span>{{ p.name }}</span>
          </a>
        } @empty {
          <p>Aucun personnage lie.</p>
        }
      </div>
    </section>
  }
}
