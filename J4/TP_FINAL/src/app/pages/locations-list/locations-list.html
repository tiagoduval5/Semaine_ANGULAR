<section class="page">
  <h1>Liste des lieux</h1>
  <p class="intro">Parcourez les lieux de l'univers Rick and Morty.</p>

  @if (chargement()) {
    <app-loader />
  } @else if (erreur()) {
    <app-error-message [message]="erreur()!" (retry)="charger()" />
  } @else {
    <div class="grille">
      @for (l of lieux(); track l.id) {
        <a class="carte carte-icone" [routerLink]="['/locations', l.id]">
          <div class="entete entete--lieu">
            <span class="emoji" aria-hidden="true">🪐</span>
            <span class="badge">{{ l.type || 'Lieu' }}</span>
          </div>
          <div class="corps">
            <h3>{{ l.name }}</h3>
            <p class="meta meta-accent">{{ l.dimension | truncate: 50 }}</p>
          </div>
        </a>
      }
    </div>
    <app-paginator
      [currentPage]="pageCourante()"
      [totalPages]="totalPages()"
      (prev)="pagePrecedente()"
      (next)="pageSuivante()"
    />
  }
</section>
