<section class="page">
  <h1>Liste des lieux</h1>
  <p class="intro">Parcourez les lieux de l'univers Rick and Morty.</p>

  @if (chargement()) {
    <app-loader />
  } @else if (erreur()) {
    <app-error-message [message]="erreur()!" (retry)="charger()" />
  } @else {
    <div class="grille">
      @for (l of lieux(); track l.id) {
        <a class="carte" [routerLink]="['/locations', l.id]">
          <h3>{{ l.name }}</h3>
          <p>{{ l.type }}</p>
          <p>{{ l.dimension | truncate: 50 }}</p>
        </a>
      }
    </div>
    <app-paginator
      [currentPage]="pageCourante()"
      [totalPages]="totalPages()"
      (prev)="pagePrecedente()"
      (next)="pageSuivante()"
    />
  }
</section>
