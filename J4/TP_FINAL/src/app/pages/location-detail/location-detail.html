<a class="back" routerLink="/locations">← Retour a la liste</a>

@if (chargement()) {
  <app-loader />
} @else if (erreur()) {
  <app-error-message [message]="erreur()!" (retry)="chargerFiche()" />
} @else {
  @if (lieu(); as l) {
    <section class="fiche">
      <h1>{{ l.name }}</h1>
      <p><strong>Type :</strong> {{ l.type }}</p>
      <p><strong>Dimension :</strong> {{ l.dimension }}</p>

      <h2>Residents</h2>
      <div class="residents">
        @for (r of residents(); track r.id) {
          <a class="resident" [routerLink]="['/characters', r.id]">
            <img [src]="r.image" [alt]="r.name" />
            <span>{{ r.name }}</span>
          </a>
        } @empty {
          <p>Aucun resident connu pour ce lieu.</p>
        }
      </div>
    </section>
  }
}
