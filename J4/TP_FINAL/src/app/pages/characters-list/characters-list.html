<section class="page">
  <h1>Liste des personnages</h1>
  <p class="intro">Cherchez par nom et filtrez par statut (vivant, mort, inconnu).</p>

  <div class="filtres">
    <app-search-bar (recherche)="onRecherche($event)" />
    <select [ngModel]="statusFiltre()" (ngModelChange)="onStatusChange($event)">
      <option value="">Tous les statuts</option>
      <option value="alive">Vivant</option>
      <option value="dead">Mort</option>
      <option value="unknown">Inconnu</option>
    </select>
  </div>

  @if (etat$ | async; as etat) {
    @if (etat.loading) {
      <app-loader />
    } @else if (etat.error) {
      <app-error-message [message]="etat.error" (retry)="reessayer()" />
    } @else if (etat.data) {
      <div class="grille">
        @for (p of etat.data.results; track p.id) {
          <app-character-card
            [personnage]="p"
            [estFavori]="favoris.isFavori(p.id)"
            (toggleFavori)="favoris.toggle($event)"
          />
        }
      </div>
      <app-paginator
        [currentPage]="pageCourante()"
        [totalPages]="etat.data.info.pages"
        (prev)="pagePrecedente()"
        (next)="pageSuivante()"
      />
    }
  }
</section>
