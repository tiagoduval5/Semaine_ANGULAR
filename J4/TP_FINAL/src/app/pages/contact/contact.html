<section class="page contact-page">
  <header class="contact-entete">
    <h1>Contact</h1>
    <p class="intro">Remplissez le formulaire ci-dessous pour nous envoyer un message.</p>
  </header>

  <div class="contact-bloc">
    @if (messageEnvoye()) {
      <p class="succes" role="status">✅ Message envoyé avec succès. Merci.</p>
    }

    <form [formGroup]="formulaire" (ngSubmit)="envoyer()">
    <label>
      Nom
      <input formControlName="nom" />
      @if (formulaire.controls.nom.touched && formulaire.controls.nom.invalid) {
        <span class="err">Minimum 3 caracteres.</span>
      }
    </label>

    <label>
      Email
      <input formControlName="email" type="email" />
      @if (formulaire.controls.email.touched && formulaire.controls.email.invalid) {
        <span class="err">Email invalide.</span>
      }
    </label>

    <label>
      Message
      <textarea formControlName="message" rows="5"></textarea>
      @if (formulaire.controls.message.touched && formulaire.controls.message.invalid) {
        <span class="err">Minimum 10 caracteres.</span>
      }
    </label>

    <button type="submit" [disabled]="formulaire.invalid">Envoyer</button>
    </form>
  </div>
</section>
