<section class="page">
  <a class="back" routerLink="/">← Retour a la liste</a>
  <h1>Favoris ({{ favoris.nombre() }} ⭐)</h1>

  @if (favoris.favoris().length === 0) {
    <p class="state">Aucun favori pour le moment.</p>
  } @else {
    <div class="grille">
      @for (d of favoris.favoris(); track d.id) {
        <article class="carte">
          <a [routerLink]="['/digimon', d.id]">
            <img [src]="d.image" [alt]="d.name" />
            <h3>{{ d.name }}</h3>
          </a>
          <button (click)="favoris.toggle(d)">Retirer des favoris</button>
        </article>
      }
    </div>
  }
</section>
